server.port=${PORT:8080}
spring.application.name=PowerFitnessKurnool

# Supabase PostgreSQL Datasource (Configurable via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.tvbwnhndjodzzfwmexwn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hassan@kareem@parvez1500}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Conservative configuration for Supabase Supavisor Session Mode & Render)
spring.datasource.hikari.pool-name=PowerFitnessHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:120000}
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB